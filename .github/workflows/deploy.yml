name: Deploy

# Deploys a released version to the team's hub server (docs/deploy.md#automatic-deploys). The
# release workflow calls it after publishing a new version's images; a repository admin runs it by
# hand to redeploy, or to roll back to an older version. It deploys only images whose signed
# provenance says release.yml built them on main, and hands the server their digests. On the server
# the deploy key is a forced command: this job can ask for `agentmesh-deploy deploy …` or `status`,
# never a shell.
on:
  workflow_call:
    inputs:
      version:
        description: The released version to deploy
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: The released version to deploy, such as 0.5.1 (an older one rolls back)
        type: string
        required: true

permissions:
  contents: read
  id-token: write # the cloud sign-in (OIDC, Azure or AWS); no cloud password is stored anywhere
  attestations: read # the images' build provenance

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The secrets live in this environment, which deploys only from main; the cloud identity
    # (Azure or AWS) trusts only this environment's tokens.
    environment: production
    # One deploy at a time. A second one waits: cancelling a deploy halfway helps no one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VERSION: ${{ inputs.version }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'mesh' }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_NSG: ${{ vars.AZURE_NSG }}
      SSH_RULE: ${{ vars.DEPLOY_SSH_RULE || 'github-deploy-ssh' }}
      SSH_RULE_PRIORITY: ${{ vars.DEPLOY_SSH_RULE_PRIORITY || '200' }}
      # On AWS: a security group of its own, attached to the instance, that holds only this job's rule.
      AWS_DEPLOY_SG: ${{ vars.AWS_DEPLOY_SG }}
    steps:
      - name: Check the request
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] ||
            { echo "::error::The version must look like 0.5.1."; exit 1; }
          [ -n "$DEPLOY_HOST" ] || { echo "::error::Set the DEPLOY_HOST repository variable."; exit 1; }
          echo "Deploying **$VERSION** to \`$DEPLOY_HOST\`." >> "$GITHUB_STEP_SUMMARY"

      # A release deploys the version it just published. Anything else needs a repository admin:
      # a manual run, and any re-run (re-running an old release would redeploy an old version).
      # triggering_actor is whoever started this attempt, also for a re-run.
      - name: Check who started this deploy
        env:
          EVENT: ${{ github.event_name }}
          ATTEMPT: ${{ github.run_attempt }}
          STARTED_BY: ${{ github.triggering_actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = push ] && [ "$ATTEMPT" = 1 ]; then exit 0; fi
          ROLE=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$STARTED_BY/permission" --jq .permission) ||
            ROLE=unknown
          [ "$ROLE" = admin ] ||
            { echo "::error::Only a repository admin may deploy by hand or re-run a deploy ($STARTED_BY: $ROLE)."; exit 1; }

      # Only images release.yml built on main, as GitHub's signed build provenance says: an image
      # pushed to the same tag from any other workflow or branch is refused. The server then pulls
      # them by these digests, so the tag can no longer change what runs.
      - name: Verify the release images
        id: images
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          for svc in hub discord-bridge; do
            name="ghcr.io/${OWNER,,}/agentmesh-$svc"
            # The digest the tag points at now; it is then verified, and deployed, as is.
            digest=$(docker buildx imagetools inspect "$name:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"') ||
              { echo "::error::$name:$VERSION is not published."; exit 1; }
            [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Unexpected digest for $name:$VERSION."; exit 1; }
            gh attestation verify "oci://$name@$digest" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref refs/heads/main --deny-self-hosted-runners >/dev/null ||
              { echo "::error::$name:$VERSION ($digest) has no build provenance from release.yml on main; refusing it."; exit 1; }
            echo "- \`agentmesh-$svc\` $digest" >> "$GITHUB_STEP_SUMMARY"
            echo "${svc//-/_}=$digest" >> "$GITHUB_OUTPUT"
          done

      # Only the smoke test's script; the job token stays out of .git/config.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          sparse-checkout: deploy/auto-deploy/nats-smoke.mjs
          sparse-checkout-cone-mode: false

      - name: Sign in to Azure
        if: vars.AZURE_NSG != ''
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          echo "::add-mask::$TOKEN"
          az login --service-principal --username "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" \
            --federated-token "$TOKEN" --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      # AWS accepts only this repo's `production` tokens for the role (OIDC), and the role may only
      # add and remove inbound rules in the deploy security group.
      - name: Sign in to AWS
        if: vars.AWS_DEPLOY_SG != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: agentmesh-deploy-${{ github.run_id }}
          role-skip-session-tagging: true
          mask-aws-account-id: true

      # Port 22 stays closed to everyone else: the rule names only this runner's address and is
      # removed when the job ends, whatever happens.
      - name: Open SSH to this runner
        if: vars.AZURE_NSG != '' || vars.AWS_DEPLOY_SG != ''
        run: |
          IP=$(curl -4 -fsS --retry 3 https://api.ipify.org)
          [[ "$IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] ||
            { echo "::error::Could not read this runner's public IPv4 address."; exit 1; }
          if [ -n "$AZURE_NSG" ]; then
            # A run that died before its cleanup may have left its rule behind.
            az network nsg rule delete -g "$AZURE_RESOURCE_GROUP" --nsg-name "$AZURE_NSG" -n "$SSH_RULE" \
              --output none 2>/dev/null || true
            az network nsg rule create -g "$AZURE_RESOURCE_GROUP" --nsg-name "$AZURE_NSG" -n "$SSH_RULE" \
              --priority "$SSH_RULE_PRIORITY" --direction Inbound --access Allow --protocol Tcp \
              --source-address-prefixes "$IP/32" --destination-port-ranges 22 \
              --description "GitHub Actions deploy run $GITHUB_RUN_ID; removed when it ends" --output none
          fi
          if [ -n "$AWS_DEPLOY_SG" ]; then
            # The group holds only deploy rules: drop any that a run which died before its cleanup left.
            OLD=$(aws ec2 describe-security-group-rules --filters "Name=group-id,Values=$AWS_DEPLOY_SG" \
              --query 'SecurityGroupRules[?!IsEgress].SecurityGroupRuleId' --output text)
            if [ -n "$OLD" ] && [ "$OLD" != None ]; then
              aws ec2 revoke-security-group-ingress --group-id "$AWS_DEPLOY_SG" --security-group-rule-ids $OLD >/dev/null
            fi
            aws ec2 authorize-security-group-ingress --group-id "$AWS_DEPLOY_SG" --ip-permissions "$(jq -nc \
              --arg cidr "$IP/32" --arg note "GitHub Actions deploy run $GITHUB_RUN_ID, removed when it ends" \
              '[{IpProtocol: "tcp", FromPort: 22, ToPort: 22, IpRanges: [{CidrIp: $cidr, Description: $note}]}]')" >/dev/null
          fi

      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          HUB_DIGEST: ${{ steps.images.outputs.hub }}
          BRIDGE_DIGEST: ${{ steps.images.outputs.discord_bridge }}
        run: |
          [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_KNOWN_HOSTS" ] ||
            { echo "::error::Set the DEPLOY_SSH_KEY secret and the DEPLOY_KNOWN_HOSTS variable."; exit 1; }
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          remote() {
            ssh -4 -i "$RUNNER_TEMP/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
              -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              "$DEPLOY_USER@$DEPLOY_HOST" "$@"
          }
          # A new firewall rule takes a few seconds to apply.
          for i in $(seq 1 12); do
            remote status >/dev/null 2>&1 && break
            [ "$i" = 12 ] && { echo "::error::SSH to $DEPLOY_HOST does not work:"; remote status; exit 1; }
            sleep 10
          done
          remote deploy "$VERSION" "$HUB_DIGEST" "$BRIDGE_DIGEST"
          echo "Deployed **$VERSION**; the hub reports ready." >> "$GITHUB_STEP_SUMMARY"

      # From outside, the way agents connect: NATS answers on the public endpoint with a
      # certificate clients accept. A failure fails the job (GitHub alerts you); it does not roll
      # back, since a port or certificate problem is not the hub image's doing.
      - name: Smoke test the public NATS endpoint
        env:
          NATS_PORT: ${{ vars.DEPLOY_NATS_PORT || '4222' }}
        run: |
          node deploy/auto-deploy/nats-smoke.mjs "$DEPLOY_HOST" "$NATS_PORT"
          echo "The public NATS endpoint answers TLS." >> "$GITHUB_STEP_SUMMARY"

      - name: Close SSH again
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/deploy_key"
          if [ -n "$AWS_DEPLOY_SG" ] && aws sts get-caller-identity >/dev/null 2>&1; then
            RULES=$(aws ec2 describe-security-group-rules --filters "Name=group-id,Values=$AWS_DEPLOY_SG" \
              --query 'SecurityGroupRules[?!IsEgress].SecurityGroupRuleId' --output text)
            if [ -n "$RULES" ] && [ "$RULES" != None ]; then
              aws ec2 revoke-security-group-ingress --group-id "$AWS_DEPLOY_SG" --security-group-rule-ids $RULES >/dev/null
            fi
          fi
          if [ -n "$AZURE_NSG" ] && az account show --output none 2>/dev/null; then
            az network nsg rule delete -g "$AZURE_RESOURCE_GROUP" --nsg-name "$AZURE_NSG" -n "$SSH_RULE" \
              --output none
            az logout || true
          fi
