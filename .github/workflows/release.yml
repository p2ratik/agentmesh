name: Release

# A version bump merged to main is a release: publish the hub and Discord bridge images for the
# plugin's version and tag the commit vX.Y.Z. A version that is already tagged is skipped.
on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

# Queue releases so two quick merges never race to push the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read the version
        id: version
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          V=$(node -p "require('./plugins/agentmesh/.claude-plugin/plugin.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # GHCR names are lowercase; this matches DEFAULT_IMAGE_REGISTRY in apps/cli.
          echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "v$V is already tagged; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.release == 'true'
        uses: docker/setup-qemu-action@v3
      - if: steps.version.outputs.release == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.version.outputs.release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the hub image
        if: steps.version.outputs.release == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: hub
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.version.outputs.owner }}/agentmesh-hub:${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Build and push the Discord bridge image
        if: steps.version.outputs.release == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: discord-bridge
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.version.outputs.owner }}/agentmesh-discord-bridge:${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Tag the release
        if: steps.version.outputs.release == 'true'
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          git tag "v$V"
          git push origin "v$V"
