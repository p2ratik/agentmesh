name: Release

# A version bump merged to main is a release: publish the hub and Discord bridge images for the
# plugin's version and tag the commit vX.Y.Z. A version that is already tagged is skipped. When
# the repository has a DEPLOY_HOST variable, the new version is then deployed (deploy.yml).
on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  # Signed build provenance for each image (deploy.yml deploys only images this workflow built).
  id-token: write
  attestations: write

# Queue releases so two quick merges never race to push the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          # The job token must not sit in .git/config, where build-time code could read it.
          persist-credentials: false
      - name: Read the version
        id: version
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          V=$(node -p "require('./plugins/agentmesh/.claude-plugin/plugin.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # GHCR names are lowercase; this matches DEFAULT_IMAGE_REGISTRY in apps/cli.
          echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "v$V is already tagged; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.release == 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - if: steps.version.outputs.release == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - if: steps.version.outputs.release == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the hub image
        id: hub
        if: steps.version.outputs.release == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          target: hub
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.version.outputs.owner }}/agentmesh-hub:${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Build and push the Discord bridge image
        id: bridge
        if: steps.version.outputs.release == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          target: discord-bridge
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.version.outputs.owner }}/agentmesh-discord-bridge:${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      # Signed by GitHub for this workflow on main and stored next to the images. Anyone with write
      # access can push an image to these tags from another branch; only these pass the deploy.
      - name: Attest the hub image
        if: steps.version.outputs.release == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.version.outputs.owner }}/agentmesh-hub
          subject-digest: ${{ steps.hub.outputs.digest }}
          push-to-registry: true
      - name: Attest the Discord bridge image
        if: steps.version.outputs.release == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.version.outputs.owner }}/agentmesh-discord-bridge
          subject-digest: ${{ steps.bridge.outputs.digest }}
          push-to-registry: true
      - name: Tag the release
        if: steps.version.outputs.release == 'true'
        env:
          V: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "v$V"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=Authorization: basic $AUTH" push origin "v$V"

  # Ship the new version to the team's hub server (docs/deploy.md#automatic-deploys). A fork, or
  # a team without a server, sets no DEPLOY_HOST variable and skips this.
  deploy:
    needs: release
    if: needs.release.outputs.released == 'true' && vars.DEPLOY_HOST != ''
    permissions:
      contents: read
      id-token: write
      attestations: read
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.release.outputs.version }}
